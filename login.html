<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AiShortsAuto - Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: #0b0f19;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.box {
  width: 100%;
  max-width: 420px;
  background: #151b2b;
  border: 1px solid #28334d;
  border-radius: 18px;
  padding: 28px;
  box-shadow: 0 15px 40px rgba(0,0,0,.35);
}

.logo {
  text-align: center;
  font-size: 28px;
  font-weight: bold;
  margin-bottom: 8px;
}

.subtitle {
  text-align: center;
  color: #9da8bd;
  margin-bottom: 25px;
}

.tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
}

.tabs button {
  flex: 1;
  padding: 12px;
  border: 0;
  border-radius: 10px;
  background: #202940;
  color: white;
  font-weight: bold;
}

.tabs button.active {
  background: #5865f2;
}

label {
  display: block;
  margin: 12px 0 7px;
  color: #cbd3e3;
}

input {
  width: 100%;
  padding: 13px;
  border-radius: 10px;
  border: 1px solid #35415d;
  background: #0e1422;
  color: white;
  outline: none;
}

input:focus {
  border-color: #5865f2;
}

.main-btn {
  width: 100%;
  margin-top: 20px;
  padding: 14px;
  border: 0;
  border-radius: 10px;
  background: #5865f2;
  color: white;
  font-size: 16px;
  font-weight: bold;
}

.main-btn:disabled {
  opacity: .6;
}

.message {
  margin-top: 15px;
  text-align: center;
  font-size: 14px;
  line-height: 1.5;
}

.success {
  color: #55d88a;
}

.error {
  color: #ff6b6b;
}

.hidden {
  display: none;
}
</style>
</head>

<body>

<div class="box">

  <div class="logo">🤖 AiShortsAuto</div>
  <div class="subtitle">AI-Powered Social Video Automation</div>

  <div class="tabs">
    <button id="loginTab" class="active" onclick="showLogin()">Login</button>
    <button id="signupTab" onclick="showSignup()">Sign Up</button>
  </div>

  <div id="loginForm">

    <label>Email</label>
    <input
      type="email"
      id="loginEmail"
      placeholder="Enter your email"
      autocomplete="email"
    >

    <label>Password</label>
    <input
      type="password"
      id="loginPassword"
      placeholder="Enter your password"
      autocomplete="current-password"
    >

    <button class="main-btn" id="loginBtn" onclick="login()">
      Login
    </button>

  </div>

  <div id="signupForm" class="hidden">

    <label>Full Name</label>
    <input
      type="text"
      id="signupName"
      placeholder="Enter your name"
      autocomplete="name"
    >

    <label>Email</label>
    <input
      type="email"
      id="signupEmail"
      placeholder="Enter your email"
      autocomplete="email"
    >

    <label>Password</label>
    <input
      type="password"
      id="signupPassword"
      placeholder="Minimum 6 characters"
      autocomplete="new-password"
    >

    <button class="main-btn" id="signupBtn" onclick="signup()">
      Create Account
    </button>

  </div>

  <div id="message" class="message"></div>

</div>

<script>

// ===============================
// SUPABASE CONFIG
// ===============================

const SUPABASE_URL = "https://xrzbwjjtkrrxdsvmdfsx.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_uZTQWulR5pyZ8_6GGKcfGQ_9lX-tlz_";

const { createClient } = supabase;

const db = createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


// ===============================
// TAB SWITCH
// ===============================

function showLogin() {

  document.getElementById("loginForm").classList.remove("hidden");
  document.getElementById("signupForm").classList.add("hidden");

  document.getElementById("loginTab").classList.add("active");
  document.getElementById("signupTab").classList.remove("active");

  clearMessage();
}


function showSignup() {

  document.getElementById("loginForm").classList.add("hidden");
  document.getElementById("signupForm").classList.remove("hidden");

  document.getElementById("loginTab").classList.remove("active");
  document.getElementById("signupTab").classList.add("active");

  clearMessage();
}


// ===============================
// MESSAGE
// ===============================

function showMessage(text, type = "") {

  const box = document.getElementById("message");

  box.textContent = text;
  box.className = "message " + type;
}


function clearMessage() {

  const box = document.getElementById("message");

  box.textContent = "";
  box.className = "message";
}


// ===============================
// LOGIN
// ===============================

async function login() {

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  if (!email || !password) {

    showMessage(
      "Please enter email and password.",
      "error"
    );

    return;
  }

  const button = document.getElementById("loginBtn");

  button.disabled = true;
  button.textContent = "Logging in...";

  const { data, error } =
    await db.auth.signInWithPassword({
      email: email,
      password: password
    });

  if (error) {

    showMessage(error.message, "error");

    button.disabled = false;
    button.textContent = "Login";

    return;
  }

  showMessage(
    "Login successful! Opening AiShortsAuto...",
    "success"
  );

  setTimeout(() => {

    window.location.href = "index.html";

  }, 1000);
}


// ===============================
// SIGN UP
// ===============================

async function signup() {

  const name =
    document.getElementById("signupName").value.trim();

  const email =
    document.getElementById("signupEmail").value.trim();

  const password =
    document.getElementById("signupPassword").value;

  if (!name || !email || !password) {

    showMessage(
      "Please fill in all fields.",
      "error"
    );

    return;
  }

  if (password.length < 6) {

    showMessage(
      "Password must be at least 6 characters.",
      "error"
    );

    return;
  }

  const button = document.getElementById("signupBtn");

  button.disabled = true;
  button.textContent = "Creating account...";

  const { data, error } =
    await db.auth.signUp({

      email: email,

      password: password,

      options: {
        emailRedirectTo: "https://aishortsauto.github.io/AiShortsAuto/login.html",
        data: {
          full_name: name
        }
      }

    });

  if (error) {

    showMessage(error.message, "error");

    button.disabled = false;
    button.textContent = "Create Account";

    return;
  }

  showMessage(
    "Account created successfully! Check your email if confirmation is required.",
    "success"
  );

  button.disabled = false;
  button.textContent = "Create Account";
}


// ===============================
// CHECK EXISTING SESSION
// ===============================

async function checkSession() {

  const { data } =
    await db.auth.getSession();

  if (data.session) {

    window.location.href = "index.html";

  }
}

checkSession();

</script>

</body>
</html>
